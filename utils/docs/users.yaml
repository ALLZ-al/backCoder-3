paths:
  /api/users:
    get:
      summary: Obtiene la lista de todos los usuarios
      tags:
        - Users
      responses:
        "200":
          description: Lista de usuarios obtenida exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        "500":
          description: Error interno del servidor al consultar la base de datos.
    post:
      summary: Crea un nuevo usuario
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        "201":
          description: Usuario creado con éxito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Usuario creado con éxito
                  user:
                    $ref: '#/components/schemas/User'
        "500":
          description: Error del servidor o el email ya existe (violación de unicidad).

  /api/users/{userId}:
    get:
      summary: Obtiene un usuario por su ID
      tags:
        - Users
      parameters:
        - in: path
          name: userId
          schema:
            type: string
          required: true
          description: ID del usuario (ObjectId de MongoDB)
      responses:
        "200":
          description: Usuario encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "404":
          description: Usuario no encontrado.
        "400":
          description: ID proporcionado no es un ObjectId válido.
    put:
      summary: Actualiza la información de un usuario
      tags:
        - Users
      parameters:
        - in: path
          name: userId
          schema:
            type: string
          required: true
          description: ID del usuario a actualizar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        "200":
          description: Usuario actualizado con éxito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Usuario actualizado con éxito
                  user:
                    $ref: '#/components/schemas/User'
        "404":
          description: Usuario no encontrado para actualizar.
    delete:
      summary: Elimina un usuario por su ID
      tags:
        - Users
      parameters:
        - in: path
          name: userId
          schema:
            type: string
          required: true
          description: ID del usuario a eliminar.
      responses:
        "200":
          description: Usuario eliminado con éxito.
        "404":
          description: Usuario no encontrado para eliminar.
          

components:
  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          description: ID generado por Mongo.
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        age:
          type: number
        password:
          type: string
          description: Hash de la contraseña (nunca se devuelve en el GET).
        role:
          type: string
          enum: [user, admin]
        pets:
          type: array
          items:
            type: string
            description: ObjectId de las mascotas adoptadas
      example:
        _id: "64f8d2cbd2b123456789abcd"
        first_name: Juan
        last_name: Perez
        email: juan.perez@example.com
        age: 30
        role: user
        pets: []
        __v: 0

    CreateUser:
      type: object
      required: [first_name, last_name, email, age, password]
      properties:
        first_name:
          type: string
          example: Artie
        last_name:
          type: string
          example: Artillery
        email:
          type: string
          example: artillery.test@coder.com
        age:
          type: number
          example: 25
        password:
          type: string
          format: password
          example: testpassword123
          
    UpdateUser:
      type: object
      properties:
        first_name:
          type: string
          example: ArtieNuevo
        age:
          type: number
          example: 26